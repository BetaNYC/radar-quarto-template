# Checks WHATS-CHANGED.md on every pull request. Standard: BetaNYC's "What's changed"
# standard (betanyc-ai-workspace platform/system/whats-changed-standard.md).
# It never renders the report itself: the published analysis is not re-run in CI.
name: What's changed

on:
  pull_request:

permissions:
  contents: read

jobs:
  whats-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check WHATS-CHANGED.md (format, dates, append-only)
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref || 'main' }}"
      - name: whats-changed.qmd matches WHATS-CHANGED.md
        run: python3 scripts/whats_changed.py render WHATS-CHANGED.md --format quarto --out whats-changed.qmd --site-prefix docs/ --repo-url "https://github.com/${{ github.repository }}" --check
