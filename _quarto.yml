project:
  type: website
  resources: 
    - images
    - output
  output-dir: docs
  # Builds whats-changed.qmd from WHATS-CHANGED.md before every render.
  # In a report copied from this template, change the --repo-url to the report's repo.
  pre-render: python3 scripts/whats_changed.py render WHATS-CHANGED.md --format quarto --out whats-changed.qmd --site-prefix docs/ --repo-url https://github.com/BetaNYC/radar-quarto-template

website:
  navbar: false
  favicon: images/logos/RADAR.svg
format:
  html:
    theme:
      - cosmo
      - brand
    css:
      - style/cil-theme.css
    toc: false
    include-before-body: radar-header.html
    include-after-body: radar-footer.html
    fig-format: svg
    fig-dpi: 300
    fig-width: 12
    fig-asp: 0.618
execute:
  freeze: false
  message: false